name: Backend checks
on:
  push:
    branches: [agent/cache-first-release]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend sources
        run: python -m py_compile backend/server.py backend/cache_reuse.py backend/generate_city_map_v2_1.py
      - name: Run offline cache tests
        run: python -m unittest discover -s backend/tests -v
