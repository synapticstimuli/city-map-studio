name: Backend checks
on:
  push:
    branches: [agent/cache-first-release, agent/reconciled-v2-1]
  pull_request:
    paths:
      - "backend/**"
      - "app.js"
      - "generator-panel.js"
      - "config.js"
      - "index.html"
      - ".github/workflows/backend-check.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight API test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2,<3" "shapely>=2,<3" "pyproj>=3,<4" "geopandas>=1,<2" "osmium>=4,<5"
      - name: Compile backend sources
        run: python -m py_compile backend/server.py backend/cache_reuse.py backend/query_planner.py backend/osm_extract.py backend/benchmark_extract.py backend/generate_city_map_v2_1.py
      - name: Run offline cache tests
        run: python -m unittest discover -s backend/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: |
          node --check config.js
          node --check app.js
          node --check generator-panel.js
      - name: Check frontend configuration is loaded before application scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          assert text.index('src="config.js"') < text.index('src="app.js"') < text.index('src="generator-panel.js"')
          print("Frontend script order verified")
          PY

  real_pbf_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regional import dependencies
        run: python -m pip install -r backend/requirements-extract.txt
      - name: Download tiny real-world Geofabrik Monaco PBF
        run: |
          mkdir -p benchmark_results
          curl --fail --location --retry 2 --max-time 120 \
            --output benchmark_results/monaco-latest.osm.pbf \
            https://download.geofabrik.de/europe/monaco-latest.osm.pbf
          test "$(stat -c %s benchmark_results/monaco-latest.osm.pbf)" -gt 100000
      - name: Create small Monaco-area test boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import geopandas as gpd
          from shapely.geometry import box
          boundary = gpd.GeoDataFrame(
              geometry=[box(7.39, 43.70, 7.46, 43.77)], crs="EPSG:4326"
          )
          boundary.to_file("benchmark_results/monaco_test_bbox.geojson", driver="GeoJSON")
          print("Using a Monaco-area bounding box, NOT an official city boundary")
          PY
      - name: Benchmark real PBF import and clipping
        run: |
          python backend/benchmark_extract.py \
            --extract benchmark_results/monaco-latest.osm.pbf \
            --boundary benchmark_results/monaco_test_bbox.geojson \
            --name "Monaco-area bounding box" \
            --output benchmark_results/monaco_import.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("benchmark_results/monaco_import.json").read_text())
          assert report["feature_rows"] > 0, report
          assert report["road_or_path_rows"] > 0, report
          assert report["extract_bytes"] > 100000, report
          print("REAL PBF smoke test: passed", report)
          PY
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: monaco-real-pbf-benchmark
          path: |
            benchmark_results/monaco_import.json
            benchmark_results/monaco_test_bbox.geojson
          retention-days: 14
